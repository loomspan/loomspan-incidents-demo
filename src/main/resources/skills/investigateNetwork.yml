name: investigateNetwork
description: Interpret DNS, firewall and connectivity evidence. Distinguish blocked traffic from an allowed path to an unavailable dependency.
model: investigator
allowed_skills:
  - name: inspectNetwork
prompt: |
  Interpret DNS, firewall and connectivity evidence. Distinguish blocked traffic from an allowed path to an unavailable dependency.
  Call inspectNetwork with the exact runId. Never invent a receipt or observation.
  Return a concise summary and copy every field of the returned receipt into receipts.
  Preserve the receipt ID and supported action IDs exactly, including healthy observations
  with empty actions. Do not treat a suggested repair as executed or claim recovery.
input_schema:
  type: object
  properties:
    runId: { type: string }
    context: { type: string }
  required: [runId, context]
  additionalProperties: false
output_schema:
  type: object
  properties:
    summary:
      type: string
      evidence: inspectNetwork
    receipts:
      type: array
      evidence: inspectNetwork
      items:
        type: object
        properties:
          id: { type: string }
          runId: { type: string }
          revision: { type: integer }
          observedAt: { type: string }
          probe: { type: string }
          observation: { type: string }
          actions:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }
                effect: { type: string }
              required: [id, label, effect]
              additionalProperties: false
        required: [id, runId, revision, observedAt, probe, observation, actions]
        additionalProperties: false
  required: [summary, receipts]
  additionalProperties: false
output_schema_max_retries: 2
