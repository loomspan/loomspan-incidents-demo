name: investigateDatabase
description: Interpret local database health, cache state, hit rate and offered database operations against capacity. Distinguish a stopped database from a live but saturated database caused by cache misses. A healthy local check does not prove application reachability. Recommend only exact repairs from the receipt; a cache start preserves the configured hit rate.
rbac_roles: [RESPONDER, COMMANDER]
model: investigator
allowed_skills:
  - name: inspectDatabase
prompt: |
  Interpret local database health, cache state, hit rate and offered database operations against capacity. Distinguish a stopped database from a live but saturated database caused by cache misses. A healthy local check does not prove application reachability. Recommend only exact repairs from the receipt; a cache start preserves the configured hit rate.
  Call inspectDatabase with the exact runId. Never invent a receipt or observation.
  Return a concise summary and copy every field of the returned receipt into receipts.
  Preserve the receipt ID and supported action IDs exactly, including healthy observations
  with empty actions. Do not treat a suggested repair as executed or claim recovery.
input_schema:
  type: object
  properties:
    runId: { type: string }
    context: { type: string }
  required: [runId, context]
  additionalProperties: false
output_schema:
  type: object
  properties:
    summary:
      type: string
      evidence: inspectDatabase
    receipts:
      type: array
      evidence: inspectDatabase
      items:
        type: object
        properties:
          id: { type: string }
          runId: { type: string }
          revision: { type: integer }
          observedAt: { type: string }
          probe: { type: string }
          observation: { type: string }
          actions:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }
                effect: { type: string }
              required: [id, label, effect]
              additionalProperties: false
        required: [id, runId, revision, observedAt, probe, observation, actions]
        additionalProperties: false
  required: [summary, receipts]
  additionalProperties: false
output_schema_max_retries: 2
